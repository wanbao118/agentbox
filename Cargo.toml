[workspace]
resolver = "2"
members = [
    "crates/ab-proxy",
    "crates/ab-profiles",
    "crates/ab-runtime",
    "crates/ab-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
url = "2"
base64 = "0.22"
rand = "0.10"
tempfile = "3"
walkdir = "2"

[profile.release]
strip = true
lto = "thin"
